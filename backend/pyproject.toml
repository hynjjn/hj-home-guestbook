[project]
name = "guestbook"
version = "0.1.0"
description = "집 방명록 API"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "pillow",
    "bcrypt",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
