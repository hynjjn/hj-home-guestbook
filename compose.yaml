# local 개발용. 배포는 Cloud Run이 맡으므로 여기에 배포용 서비스는 없다.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guestbook
      POSTGRES_DB: guestbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guestbook"]
      interval: 5s
      retries: 10

  # Cloud Run에 올릴 이미지를 로컬에서 그대로 확인하고 싶을 때만 쓴다.
  #   docker compose --profile image up --build app
  app:
    profiles: ["image"]
    build:
      context: .
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://guestbook:${POSTGRES_PASSWORD:-devpass}@db:5432/guestbook
      IP_HASH_SALT: ${IP_HASH_SALT:-dev-salt-change-me}
      TOKEN_SECRET: ${TOKEN_SECRET:-dev-token-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
